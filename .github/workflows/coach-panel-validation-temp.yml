name: Temporary coach syntax validation
on:
  push:
    branches:
      - work/teaching-related-20261016
    paths:
      - live_chess_coach_panel.py
      - .github/workflows/coach-panel-validation-temp.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/teaching-related-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install python-chess selenium websocket-client
      - name: Compile and run regression tests
        id: validate
        run: |
          python -m py_compile live_chess_coach_panel.py seleniumbase_live_game_tracker.py chesskida_strategy.py gm_book.py
          python -m unittest discover -s tests -v
      - name: Record temporary result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.validate.outcome }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ "$STEP_OUTCOME" = "success" ]; then RESULT=PASS; else RESULT=FAIL; fi
          printf 'Coach validation: %s\nPython compile + existing unit tests outcome: %s\n' "$RESULT" "$STEP_OUTCOME" > .coach_validation_result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coach_validation_result.txt
          git commit -m "Record temporary coach validation result"
          git push "https://x-access-token:$GH_TOKEN@github.com/Pratik03538/selenium.git" "HEAD:refs/heads/$BRANCH_NAME"
