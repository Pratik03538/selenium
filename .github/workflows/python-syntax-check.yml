name: Python syntax and timing tests

on:
  push:
    branches:
      - feature/live-game-tracker
  pull_request:
    branches:
      - feature/live-game-tracker

jobs:
  syntax-and-timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clock-test dependency
        run: python -m pip install python-chess
      - name: Compile tracked Python modules
        run: python -m py_compile seleniumbase_live_game_tracker.py chesskida_strategy.py gm_book.py
      - name: Test adaptive clock timing profile
        run: python -m unittest discover -s tests -v
