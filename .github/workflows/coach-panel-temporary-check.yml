name: Temporary coach panel validation

on:
  push:
    branches:
      - work/teaching-related-20261016

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing test dependencies
        run: python -m pip install python-chess selenium websocket-client
      - name: Compile the new panel and untouched gameplay modules
        run: python -m py_compile live_chess_coach_panel.py seleniumbase_live_game_tracker.py chesskida_strategy.py gm_book.py
      - name: Run existing regression tests
        run: python -m unittest discover -s tests -v
